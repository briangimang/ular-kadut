<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ULAR KADUTS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <!-- ============================================= -->
    <!-- MAIN MENU -->
    <!-- ============================================= -->

    <div id="mainMenu" class="screen">

        <div class="title-glow"></div>

        <h1>ULAR KADUTS</h1>

        <div class="subtitle">
            CLASSIC SNAKE • HD EDITION
        </div>

        <div class="menu-high-score">
            HIGH SCORE <span id="menuHighScore">0</span>
        </div>

        <button
            id="playButton"
            class="menu-button"
        >
            PLAY
        </button>

        <button
            id="quitButton"
            class="menu-button"
        >
            QUIT
        </button>

        <div class="menu-controls">
            WASD / ARROW KEYS • SPACE = PAUSE
        </div>

        <div class="version">
            Snake HD v1.0
        </div>

    </div>


    <!-- ============================================= -->
    <!-- GAME UI -->
    <!-- ============================================= -->

    <div id="gameUI">

        <div class="score-container">

            <div id="score">
                SCORE&nbsp;&nbsp;0
            </div>

            <div id="highScore">
                HIGH SCORE&nbsp;&nbsp;0
            </div>

        </div>

        <div class="keyboard-info">
            WASD / ARROW KEYS / BUTTON
        </div>

    </div>


    <!-- ============================================= -->
    <!-- CONTROL PANEL -->
    <!-- ============================================= -->

    <div id="controlPanel">

        <button
            class="direction-button"
            data-direction="up"
        >
            ▲
        </button>

        <div class="horizontal-controls">

            <button
                class="direction-button"
                data-direction="left"
            >
                ◀
            </button>

            <button
                class="direction-button"
                data-direction="down"
            >
                ▼
            </button>

            <button
                class="direction-button"
                data-direction="right"
            >
                ▶
            </button>

        </div>

    </div>


    <!-- ============================================= -->
    <!-- PAUSE -->
    <!-- ============================================= -->

    <div
        id="pauseScreen"
        class="overlay-screen hidden"
    >

        <div class="overlay-content">

            <h2>PAUSED</h2>

            <p>
                Press SPACE to continue
            </p>

        </div>

    </div>


    <!-- ============================================= -->
    <!-- GAME OVER -->
    <!-- ============================================= -->

    <div
        id="gameOverScreen"
        class="overlay-screen hidden"
    >

        <div class="overlay-content game-over">

            <h2>GAME OVER</h2>

            <div
                id="finalScore"
                class="final-score"
            >
                SCORE 0
            </div>

            <div
                id="finalHighScore"
                class="final-high-score"
            >
                BEST 0
            </div>

            <p>
                Press ENTER to play again
            </p>

            <p class="secondary">
                Press ESC for main menu
            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
